# Area "image generation, SD3.5" fixture spec: Flow-GRPO + LoRA on SD3.5 Medium gated against the base alone
# (verifier-owned; prototype, unpromotable). tests/README.md section 11.22. Rendered by tests/_flow_grpo.py: {base} is
# the SD3.5 Medium base directory (MM-18: the baseline arm evaluates the base alone; its `.cache/` is outside the base
# hash), {data} the training prompt directory (one shard, train.jsonl), {items} the registered item set,
# {registration_sha256} the SHA-256 of the rendered registration.yaml.
workflow: ext-flow-grpo-fixture
version: 1
budget: {gpu_hours: 24}
artifacts:
  base:         {type: model_checkpoint, uri: "file:{base}"}
  prompts:      {type: training_dataset, uri: "file:{data}"}
  items:        {type: item_set, uri: "file:{items}", disjoint_from: [prompts]}
  trainer_cfg:  {type: trainer_config, uri: "file:trainer.yaml"}
  registration: {type: registration, uri: "file:registration.yaml@sha256:{registration_sha256}"}
stages:
  - id: rl
    uses: rl.flow_grpo@0.1
    algorithm: flow_grpo
    model_family: t2i.sd35_lora@0.1
    inputs: {model: base, data: prompts, config: trainer_cfg}
    outputs: {model: rl_ckpt}
  - id: quality_gate
    uses: gate.superiority@1.0
    evaluator: t2i.sd35_ocr_doctr_items@0.1
    sampler: deployment
    inputs: {model: rl_ckpt, baseline: base, items: items, registration: registration}
    test: {metric: ocr_b_acc, alpha: 0.025, power: 0.80, mde: 0.15, cluster_by: item, seeds: 1}
    on_fail: stop
    owner: skeleton-demo
    escalation: [skeleton-demo-lead]
