[project]
name = "gatedtrain-recipe-flow-grpo-sd35-ocr"
version = "0.1.0"
description = "gatedtrain recipe: SD3.5 Medium Flow-GRPO + LoRA with an OCR reward (diffusers + peft port of flow_grpo), with its gatedtrain adapter `flow_grpo_sd35` (prototype)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "The gatedtrain Authors"}]
requires-python = ">=3.12,<3.14"
keywords = ["post-training", "reinforcement-learning", "flow-grpo", "diffusion", "stable-diffusion", "lora", "ocr", "gatedtrain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The adapter is pure Python; the training and evaluation environment is runtime/ (its own pyproject.toml and uv.lock).
dependencies = ["gatedtrain>=0.3,<0.4"]

[project.urls]
Homepage = "https://github.com/gatedtrain/gatedtrain-recipe-flow-grpo-sd35-ocr"
Source = "https://github.com/gatedtrain/gatedtrain-recipe-flow-grpo-sd35-ocr"
Issues = "https://github.com/gatedtrain/gatedtrain-recipe-flow-grpo-sd35-ocr/issues"

[project.entry-points."gatedtrain.adapters"]
flow_grpo_sd35 = "gatedtrain_recipe_flow_grpo_sd35_ocr.rows:PLUGIN"

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
