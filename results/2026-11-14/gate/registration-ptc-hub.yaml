# Amendment for the rename to ptc-hub 0.2.0 (05 section 3.7, R17-1/R17-3): post_hoc, because the scorer changed
# after the gate beyond the rename. It amends registration.yaml beside it (sha256:2570e56e...), the published copy
# of the gate-time registration sha256:5c5892b7ae4efb2e09b412df28d0d565c64e013d972160b3e32d30fd951aba8d, from which it differs
# only in redacted comments.
# Area "image generation, SD3.5" pre-registration: Flow-GRPO + LoRA on SD3.5 Medium against the base alone, OCR text
# rendering (05 section 3.7; MULTIMODAL-SPEC row 2b and its deviations; runtime/README.md "Decisions taken"
# and its "Smoke finding"). prototype, unpromotable. Unsigned: no named team has signed it.
# Values fixed after the smoke run and before the full run's first START in gpu-guard.log. Deciding T3 metric
# `ocr_b_acc` (docTR, best-matching-substring edit distance; higher is better; [0, 1]), blocking, construct-aligned
# with the PaddleOCR reward (R15-1); superiority with margin 0; alpha 0.025 one-sided, power 0.8, m = 1; N 400, K 1,
# eval seed 11. sigma_plan fixed 0.48 = max(1.5 x ucb80(s_pilot), sqrt(2) x ucb80(s_base)) from the smoke
# (s_pilot 0.227 = SD of 40 paired differences smoke cut 2 vs base; s_base 0.301; ucb80 with 39 df: 0.2525, 0.3351;
# 1.5 x 0.2525 = 0.379, sqrt(2) x 0.3351 = 0.474, rounded up). Planning effect 0.07: n_required =
# ceil(((1.95996 + 0.84162) x 0.48 / 0.07)^2) = 370 <= 400 (MDE at N 400: 0.067).
# Any later change is an amendment: a new registration with `amends` and a new hash in spec.yaml (05:166).
registration_version: 1
registration_id: mm-a5-sd35-ocr-superiority-v1
signed_by: prototype-unsigned
amends: "sha256:2570e56e0ae63755f79d213a96246a4102486f3433f61e37bd669ab2f7cbbec1"
created_at: "2026-11-17T18:20:42Z"
workflow: mm-a5-sd35-flow-grpo
gate: quality_gate
clause:
  type: superiority
  metric: ocr_b_acc
  direction: higher_is_better
  margin: 0.0
  alpha: 0.025
  power: 0.8
  planning_effect: 0.07
  sigma_plan: fixed
  unit: item
  samples_per_item: 1
  eval_seeds: [11]
  interval: cluster_bootstrap
  blocking: true
margin_justification: >-
  Superiority with delta_sup = 0: any held-out gain of mean docTR OCR accuracy counts. Prototype value, not reviewed
  by a named team.
sigma_pilot:
  sigma: 0.48
  source: >-
    GPU smoke (records/area5-sd35/smoke-2, eval-smoke-base-2, eval-smoke-cut-1): first 40 registered items, seed 11,
    the deployment sampler. Paired differences of ocr_b_acc, smoke cut 2 (4 optimizer steps) minus base: mean -0.040,
    SD 0.227; base item SD 0.301. sigma_plan = max(1.5 x ucb80(0.227), sqrt(2) x ucb80(0.301)) = 0.474, rounded up to
    0.48 (the 1.5 factor covers area 3's ratio 1.43 of the full-run SD to the pilot's; sqrt(2) x the base SD bounds
    the paired SD of independent arms).
baseline_pilot_mean: 0.412    # base, first 40 items (mode share 0.175, sd 0.301)
construct_alignment: >-
  ocr_b_acc measures the construct of the training reward ocr_accuracy_paddleocr (the quoted text is legibly
  rendered) with another OCR engine (docTR db_resnet50 + crnn_vgg16_bn, not PaddleOCR PP-OCRv4) and another formula
  (the best-matching substring of the recognized text instead of the whole-page edit distance). The formula was chosen
  after the smoke baseline (the whole-page formula scored 0 on 52.5 % of the base's 40 smoke items because docTR reads
  background texture as text) and before this registration. A pass shows that the reward's gain transfers to an
  independent OCR engine, not that the images are better otherwise.
eval_distribution:
  item_set_hash: "sha256:0b01553c4c74ef18c9954dca686c8edc00b18e20e3d43346265858303d8ad4a7"   # manifest of area5-sd35/items/
# The deployment sampler (every cut's sampler.json; eval_images.py uses it unchanged): 10-step Euler ODE
# (noise_level 0), CFG 4.5, 512 px, fp16 transformer.
